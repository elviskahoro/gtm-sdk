# Tach module boundary enforcement for gtm-sdk
# Enforces architectural rules from AGENTS.md:
# - No cross-lib imports (libs.* modules are adapters, not dependencies of each other)
# - No orchestration in libs/ (only in src/, cli/, or webhooks/)
# - No business logic in cli/ (only parsing, preflight, output rendering)

source_roots = ["."]
exclude = [
  # Modal entrypoint must live at repo root (src/attio/ would shadow the
  # attio pip package if deploy.py moved under src/). Keep it out of the
  # module graph rather than inventing a one-file root module for it.
  "deploy.py",
  "tests/**",
  "docs/**",
  "api/**",
  "tmp/**",
  "worktrees/**",
  ".github/**",
  ".venv/**",
  ".kilo/**",
  ".context/**",
]

forbid_circular_dependencies = true
# Fail when depends_on lists declare imports the code does not make.
exact = true
# Every file under source_roots must belong to a configured module.
root_module = "forbid"
# Enforce TYPE_CHECKING imports too (webhook protocol stubs, etc.).
ignore_type_checking_imports = false
# Treat importlib-style string imports as real dependencies.
include_string_imports = true
# Layers do not imply free depends_on — every edge must be explicit.
layers_explicit_depends_on = true
layers = ["tooling", "edge", "orchestration", "adapters", "products"]

[rules]
unused_ignore_directives = "error"
require_ignore_directive_reasons = "error"

[external]
# pytest is imported inside adapter helpers for optional local checks; it is a
# dev dependency, not a runtime dep of the gtm package.
exclude = ["pytest"]

# ============================================================================
# UTILITIES: Accessible from anywhere (no dependencies)
# ============================================================================

[[modules]]
path = "libs.telemetry"
layer = "adapters"
utility = true

[[modules]]
path = "libs.logging"
layer = "adapters"
utility = true

[[modules]]
path = "libs.filesystem"
layer = "adapters"
utility = true

# ============================================================================
# CORE LAYERS: scripts → cli/webhooks → src → libs
# ============================================================================

[[modules]]
path = "scripts"
layer = "tooling"
visibility = []
depends_on = [
  "cli",
  "libs.attio",
  "libs.caldotcom",
  "libs.dlt",
  "libs.fathom",
  "libs.fireflies",
  "libs.linear",
  "libs.motherduck",
  "libs.octolens",
  "libs.rb2b",
  "src",
]

[[modules]]
path = "cli"
layer = "edge"
visibility = ["scripts"]
depends_on = [
  "libs.attio",
  "libs.dlt",
  "libs.gmail",
  "libs.granola",
  "libs.infisical",
  "libs.parsers",
  "libs.sanity",
  "libs.webhook",
  "src",
]

[[modules]]
path = "src"
layer = "orchestration"
visibility = ["scripts", "cli", "webhooks"]
depends_on = [
  "libs.apollo",
  "libs.attio",
  "libs.caldotcom",
  "libs.clay_http",
  "libs.dlt",
  "libs.exa",
  "libs.fathom",
  "libs.fireflies",
  "libs.granola",
  "libs.harvest",
  "libs.infisical",
  "libs.linear",
  "libs.meetings",
  "libs.motherduck",
  "libs.octolens",
  "libs.parallel",
  "libs.parsers",
  "libs.rb2b",
  "libs.sanity",
  "libs.slack",
  "libs.webhook",
]

[[modules]]
path = "webhooks"
layer = "edge"
visibility = ["scripts"]
depends_on = [
  "libs.attio",
  "libs.dlt",
  "libs.infisical",
  "libs.slack",
  "libs.webhook",
  "src",
]

