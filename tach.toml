# Tach module boundary enforcement for gtm-sdk
# Enforces architectural rules from AGENTS.md:
# - No cross-lib imports (libs.* modules are adapters, not dependencies of each other)
# - No orchestration in libs/ (only in src/, cli/, or webhooks/)
# - No business logic in cli/ (only parsing, preflight, output rendering)

source_roots = ["."]
exclude = [
  # Modal entrypoint must live at repo root (src/attio/ would shadow the
  # attio pip package if deploy.py moved under src/). Keep it out of the
  # module graph rather than inventing a one-file root module for it.
  "deploy.py",
  "tests/**",
  "docs/**",
  "api/**",
  "tmp/**",
  "worktrees/**",
  "scripts/**",
  ".github/**",
  ".venv/**",
  ".kilo/**",
  ".context/**",
]

forbid_circular_dependencies = true
# Fail when depends_on lists declare imports the code does not make. Without
# this, cli/src/webhooks can keep a "depend on every adapter" allowlist and
# new cross-layer imports never get reviewed in tach.toml.
exact = true
# Every file under source_roots must belong to a configured module. The
# previous default ("ignore") left undeclared packages like libs.clay_http
# invisible to the graph.
root_module = "forbid"
ignore_type_checking_imports = true

# ============================================================================
# UTILITIES: Accessible from anywhere (no dependencies)
# ============================================================================

[[modules]]
path = "libs.telemetry"
utility = true

[[modules]]
path = "libs.logging"
utility = true

[[modules]]
path = "libs.filesystem"
utility = true

# ============================================================================
# CORE LAYERS: CLI → SRC/WEBHOOKS → LIBS
# ============================================================================

[[modules]]
path = "cli"
depends_on = [
  "src",
  "libs.attio",
  "libs.dlt",
  "libs.gmail",
  "libs.granola",
  "libs.infisical",
  "libs.parsers",
  "libs.sanity",
  "libs.webhook",
]

[[modules]]
path = "src"
depends_on = [
  "libs.apollo",
  "libs.attio",
  "libs.caldotcom",
  "libs.clay_http",
  "libs.dlt",
  "libs.exa",
  "libs.fathom",
  "libs.fireflies",
  "libs.granola",
  "libs.harvest",
  "libs.infisical",
  "libs.linear",
  "libs.meetings",
  "libs.motherduck",
  "libs.octolens",
  "libs.parallel",
  "libs.parsers",
  "libs.rb2b",
  "libs.sanity",
  "libs.slack",
  "libs.webhook",
]

[[modules]]
path = "webhooks"
depends_on = [
  "src",
  "libs.attio",
  "libs.dlt",
  "libs.infisical",
  "libs.slack",
]

