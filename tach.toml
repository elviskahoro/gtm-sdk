# Tach module boundary enforcement for gtm-sdk
# Enforces architectural rules from AGENTS.md:
# - No cross-lib imports (libs.* modules are adapters, not dependencies of each other)
# - No orchestration in libs/ (only in src/, cli/, or webhooks/)
# - No business logic in cli/ (only parsing, preflight, output rendering)

source_roots = ["."]
exclude = [
  "tests/**",
  "docs/**",
  "api/**",
  "tmp/**",
  "worktrees/**",
  "scripts/**",
  ".github/**",
  ".venv/**",
  ".kilo/**",
  ".context/**",
]

forbid_circular_dependencies = true
ignore_type_checking_imports = true

# Utilities: accessible from anywhere (no dependencies)
[[modules]]
path = "libs.telemetry"
utility = true

[[modules]]
path = "libs.logging"
utility = true

[[modules]]
path = "libs.filesystem"
utility = true

# Core layers with dependencies
[[modules]]
path = "cli"
depends_on = ["src", "libs"]

[[modules]]
path = "src"
depends_on = ["libs"]

[[modules]]
path = "webhooks"
depends_on = ["src", "libs"]

# Adapter modules cannot depend on each other (only on utilities)
[[modules]]
path = "libs"
depends_on = ["libs.telemetry", "libs.logging", "libs.filesystem"]

# Data export is standalone
[[modules]]
path = "data-gen"
depends_on = []
