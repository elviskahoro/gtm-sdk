# Tach module boundary enforcement for gtm-sdk
# Enforces architectural rules from AGENTS.md:
# - No cross-lib imports (libs.* modules are adapters, not dependencies of each other)
# - No orchestration in libs/ (only in src/, cli/, or webhooks/)
# - No business logic in cli/ (only parsing, preflight, output rendering)

source_roots = ["."]
exclude = [
  "tests/**",
  "docs/**",
  "api/**",
  "tmp/**",
  "worktrees/**",
  "scripts/**",
  ".github/**",
  ".venv/**",
  ".kilo/**",
  ".context/**",
]

forbid_circular_dependencies = true
ignore_type_checking_imports = true

# ============================================================================
# UTILITIES: Accessible from anywhere (no dependencies)
# ============================================================================

[[modules]]
path = "libs.telemetry"
utility = true

[[modules]]
path = "libs.logging"
utility = true

[[modules]]
path = "libs.filesystem"
utility = true

# ============================================================================
# CORE LAYERS: CLI → SRC/WEBHOOKS → LIBS
# ============================================================================

[[modules]]
path = "cli"
depends_on = ["src", "libs.apollo", "libs.attio", "libs.browserbase", "libs.caldotcom",
              "libs.dlt", "libs.exa", "libs.fathom", "libs.fireflies", "libs.gmail",
              "libs.granola", "libs.harvest", "libs.infisical", "libs.linear", "libs.linkedin",
              "libs.logging", "libs.meetings", "libs.motherduck", "libs.octolens", "libs.openai",
              "libs.parallel", "libs.parsers", "libs.perplexity", "libs.rb2b", "libs.resend",
              "libs.sanity", "libs.slack", "libs.telemetry", "libs.webhook", "libs.filesystem"]

[[modules]]
path = "src"
depends_on = ["libs.apollo", "libs.attio", "libs.browserbase", "libs.caldotcom",
              "libs.dlt", "libs.exa", "libs.fathom", "libs.fireflies", "libs.gmail",
              "libs.granola", "libs.harvest", "libs.infisical", "libs.linear", "libs.linkedin",
              "libs.logging", "libs.meetings", "libs.motherduck", "libs.octolens", "libs.openai",
              "libs.parallel", "libs.parsers", "libs.perplexity", "libs.rb2b", "libs.resend",
              "libs.sanity", "libs.slack", "libs.telemetry", "libs.webhook", "libs.filesystem"]

[[modules]]
path = "webhooks"
depends_on = ["src", "libs.apollo", "libs.attio", "libs.browserbase", "libs.caldotcom",
              "libs.dlt", "libs.exa", "libs.fathom", "libs.fireflies", "libs.gmail",
              "libs.granola", "libs.harvest", "libs.infisical", "libs.linear", "libs.linkedin",
              "libs.logging", "libs.meetings", "libs.motherduck", "libs.octolens", "libs.openai",
              "libs.parallel", "libs.parsers", "libs.perplexity", "libs.rb2b", "libs.resend",
              "libs.sanity", "libs.slack", "libs.telemetry", "libs.webhook", "libs.filesystem"]

