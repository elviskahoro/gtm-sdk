# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: uv
    directory: / # Location of package manifests
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # trunk's pinact linter enforces that every `uses:` is SHA-pinned, but pinning is
  # not upgrading -- nothing was bumping these, which is how trunk-check.yml drifted
  # to setup-uv v7.6.0 while the test workflows sat on v8.3.2. Dependabot rewrites the
  # SHA and the trailing `# vX.Y.Z` comment together, so pinact stays satisfied.
  - package-ecosystem: github-actions
    directory: / # `/` covers .github/workflows/**
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
