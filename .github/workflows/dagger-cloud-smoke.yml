# Standing retest harness for issue #223: does the DAGGER_CLOUD_TOKEN secret
# provision a managed Dagger Cloud engine? It only succeeds with a token of
# Dagger Cloud's `Engine` type, which this org cannot mint without Cloud Engines
# early access.
#
# Kept deliberately. CI has moved to a local engine on Namespace, but Dagger has
# a managed-compute product landing and we intend to revisit `--cloud` when it
# ships. Dispatch this first — it answers in ~15 seconds whether the entitlement
# is there, before anyone spends time refactoring a workflow around it.
#
# The nightly integration suite is a poor rig for the same question: it takes
# minutes, needs four unrelated API secrets, and buries the auth error. This runs
# one container and nothing else, so token/provisioning is the only thing it can
# fail on.
#
# Manual only. It previously also fired on a now-deleted branch.
name: Dagger Cloud smoke

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    name: Provision a Dagger Cloud engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Dagger
        uses: dagger/dagger-for-github@e47aba410ef9bb9ed81a4d2a97df31061e5e842e # 8.0.0

      # Separates "secret missing" from "secret present but wrong type" — the two
      # failure modes look nothing alike and conflating them is what hid the
      # DAGGER_CLOUD_COMPUTE_TOKEN regression for ten days. Presence only: never
      # echo a length or substring of the token, since GitHub masks the literal
      # secret but not values derived from it.
      - name: Verify token is present
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        run: |
          if [ -z "${DAGGER_CLOUD_TOKEN}" ]; then
            echo "::error::DAGGER_CLOUD_TOKEN is empty."
            exit 1
          fi
          echo "DAGGER_CLOUD_TOKEN is set."

      # A successful provision + exec proves the token is Engine-typed. A wrong
      # type dies here with "failed to provision a remote Engine: invalid token
      # type" before the query is ever sent.
      - name: Run a container on the cloud engine
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        run: |
          echo '{container{from(address:"alpine:latest"){withExec(args:["echo","dagger cloud engine ok"]){stdout}}}}' \
            | dagger --cloud --progress plain query
