name: Publish Python package

# The Dagger controller is the complete release path: it validates the tag,
# builds the distributions, and uploads them to PyPI. Run the same controller
# locally from the matching tag with RELEASE_TAG=v<version> and PYPI_TOKEN
# in the environment.
on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Setup Dagger
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: 0.21.7

      - name: Build and publish through Dagger
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv run dagger run python .github/workflows/ci/pypi_publish_dagger.py
