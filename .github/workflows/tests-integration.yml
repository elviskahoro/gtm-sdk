name: Integration tests

on:
  schedule:
    - cron: "0 12 * * *" # trunk-ignore(yamllint/quoted-strings)
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish_dependency_image:
    name: Publish ARM64 pytest dependency image
    runs-on: ubuntu-24.04-arm
    outputs:
      pytest_image: ${{ steps.publish_pytest.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: flox/install-flox-action@1128abd73431089ab9d871c893b4e72a729354e1 # v2.6.0
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: 0.21.7
      - name: Publish ARM64 Flox toolchain image
        id: publish_toolchain
        env:
          FLOX_TOOLCHAIN_IMAGE: ghcr.io/${{ github.repository }}/flox-toolchain:${{ github.sha }}-arm64
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run dagger run python .github/workflows/ci/flox_image_dagger.py
      - name: Publish ARM64 pytest dependency image
        id: publish_pytest
        env:
          FLOX_TOOLCHAIN_IMAGE: ${{ steps.publish_toolchain.outputs.image_ref }}
          PYTEST_DEPENDENCY_IMAGE: ghcr.io/${{ github.repository }}/pytest-deps:${{ github.sha }}-arm64
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run dagger run python .github/workflows/ci/pytest_dependency_image_publish.py

  pytest-integration:
    name: Integration tests
    needs: publish_dependency_image
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Pinned by SHA per repo convention; the official action avoids the
      # `curl | sh` install pattern (semgrep gha-curl-pipe-shell). Needs the
      # checkout first — the uv version resolves from pyproject.toml.
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Restore Dagger Python SDK
        id: dagger_cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.dagger-sdk
          key: ${{ runner.os }}-${{ runner.arch }}-integration-dagger-sdk-v1-restore
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-integration-dagger-sdk-v1-

      - name: Install Dagger Python SDK
        id: dagger_sdk
        run: |
          set -euo pipefail
          export UV_PYTHON_INSTALL_DIR="$HOME/.dagger-sdk/uv-python"
          dagger_venv="$HOME/.dagger-sdk/controller-venv"
          mkdir -p "${dagger_venv}" "${UV_PYTHON_INSTALL_DIR}"
          if ! "${dagger_venv}/bin/python" - <<'PY' 2>/dev/null
          from importlib.metadata import version
          import anyio
          import dagger
          assert version("dagger-io") == "0.21.7"
          assert version("anyio") == "4.13.0"
          PY
          then
            uv python install --reinstall 3.13
            find "${dagger_venv}" -mindepth 1 -delete
            uv venv --python 3.13 "${dagger_venv}"
            uv pip install --python "${dagger_venv}/bin/python" \
              "dagger-io==0.21.7" "anyio==4.13.0"
            echo "rebuilt=true" >> "$GITHUB_OUTPUT"
          else
            echo "rebuilt=false" >> "$GITHUB_OUTPUT"
          fi
          echo "${dagger_venv}/bin" >> "$GITHUB_PATH"

      - name: Save repaired Dagger Python SDK
        if: steps.dagger_cache.outputs.cache-matched-key == '' || steps.dagger_sdk.outputs.rebuilt == 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.dagger-sdk
          key: ${{ runner.os }}-${{ runner.arch }}-integration-dagger-sdk-v1-${{ hashFiles('uv.lock', '.github/workflows/tests-integration.yml') }}-${{ github.run_id }}

      # `version` is pinned deliberately: without it the action installs the
      # latest CLI at run time, so an upstream Dagger release silently changes
      # the engine version and forces a cold image pull with no diff in this
      # repo. Keep in lockstep with the dagger-io pin above.
      - name: Setup Dagger
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: 0.21.7

      - name: Resolve Dagger engine version
        id: dagger_engine
        run: |
          set -uo pipefail
          version="$(dagger version 2>/dev/null | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)"
          if [ -z "${version}" ]; then
            echo "::warning::could not determine Dagger engine version; skipping pre-pull"
          fi
          echo "version=${version}" >>"${GITHUB_OUTPUT}"

      # This job ran on a managed Dagger Cloud engine (`dagger --cloud run`) from
      # #222 until this revert. That never worked: `--cloud` requires a token of
      # Dagger Cloud's `Engine` type, and the elviskahoro org cannot mint one
      # without Cloud Engines early access, which is still not enabled (issue
      # #223). Every scheduled run from 2026-07-16 onward failed before pytest
      # started.
      #
      # Not a permanent verdict on managed compute: Dagger has a new product
      # landing and #223 stays open to revisit this once it ships. Dispatch
      # `dagger-cloud-smoke.yml` to check the entitlement before refactoring.
      #
      # registry.dagger.io brownouts (dagger/dagger#7548) stall the first-use
      # engine pull and kill the job before any test runs. GitHub-hosted runners
      # are fresh VMs, so retry each bounded pull instead of caching Docker state.
      - name: Ensure Dagger engine image (resilient to registry flakiness)
        if: steps.dagger_engine.outputs.version != ''
        env:
          ENGINE_VERSION: ${{ steps.dagger_engine.outputs.version }}
        run: |
          set -uo pipefail
          image="registry.dagger.io/engine:${ENGINE_VERSION}"
          if docker image inspect "${image}" >/dev/null 2>&1; then
            echo "Dagger engine image cache: local hit (${image})"
            exit 0
          fi
          for attempt in $(seq 1 6); do
            if timeout 150 docker pull "${image}"; then
              echo "Dagger engine image cache: registry pull succeeded on attempt ${attempt} (${image})"
              exit 0
            fi
            echo "::warning::engine pull attempt ${attempt}/6 failed (registry.dagger.io flake); retrying in 20s"
            sleep 20
          done
          echo "::error::failed to pull ${image} after 6 attempts"
          exit 1

      # DAGGER_CLOUD_TOKEN here is the org's *telemetry* token — the local engine
      # reads it from the runner's process environment to ship traces to Dagger
      # Cloud. That is what this token type is for, and it works; only engine
      # provisioning ever rejected it. Absence degrades to "no traces", so this is
      # deliberately not gated. Synced from Infisical by its GitHub App, same path
      # as the ATTIO/MODAL/PARALLEL keys below.
      # See https://docs.dagger.io/reference/configuration/cloud/
      - name: Run integration pytest in Dagger
        env:
          # The integration runner is ARM64. Consume the digest returned by
          # the prerequisite publication, not its mutable tag.
          PYTEST_DEPENDENCY_IMAGE: ${{ needs.publish_dependency_image.outputs.pytest_image }}
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          ATTIO_API_KEY: ${{ secrets.ATTIO_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
        run: dagger run python .github/workflows/ci/pytest_integration_dagger.py

      # If this step errors "Unauthorized access, your Trunk organization URL
      # slug or token may be incorrect", it is almost always a dead/revoked
      # TRUNK_API_TOKEN, NOT the org-slug: the analytics CLI mislabels a 404 on
      # a bad token as an auth/slug error. Regenerate the org token at
      # https://app.trunk.io/sanhedrin/settings and update the GHA secret. (ai-g7i)
      - name: Upload Test Results to Trunk.io
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: trunk-io/analytics-uploader@385f1ccdf345b4532dc4b6c665dd432b702b8e28 # v2.1.2
        with:
          junit-paths: junit.xml
          org-slug: sanhedrin
          token: ${{ secrets.TRUNK_API_TOKEN }}
          # Avoid resolving `latest` before looking up the cached binary.
          cli-version: 0.14.0
          # Cache the analytics CLI to avoid downloading it on every test run.
          use-cache: true
