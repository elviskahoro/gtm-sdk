name: Bazel tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bazel_full:
    name: Full Bazel suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0

      - name: Verify toolchains
        run: |
          set -euo pipefail
          uv --version
          bazel_version="$(bazel --version)"
          echo "${bazel_version}"
          if [ "${bazel_version}" != "bazel 8.7.0" ]; then
            echo "::error::expected Bazel 8.7.0, got ${bazel_version}"
            exit 1
          fi

          # rules_python 2.2 names the runnable interpreter target `python3`;
          # this asserts the hermetic toolchain, not a uv-managed runner Python.
          bazel run @python_3_13_13//:python3 -- --version 2>&1 | tee /tmp/hermetic-python-version.log
          python_version="$(tail -n 1 /tmp/hermetic-python-version.log)"
          if [ "${python_version}" != "Python 3.13.13" ]; then
            echo "::error::expected hermetic Python 3.13.13, got ${python_version}"
            exit 1
          fi

      - name: Check Bazel requirements lock
        run: scripts/bazel-requirements-sync.py --check

      - name: Run full Bazel suite
        run: bazel test //... --config=ci

      - name: Check generated Bazel files
        run: |
          set -euo pipefail
          bazel run //:gazelle_python_manifest.update
          bazel run //:gazelle
          git diff --exit-code -- \
            gazelle_python.yaml \
            MODULE.bazel.lock \
            BUILD.bazel \
            ":(glob)**/BUILD" \
            ":(glob)**/BUILD.bazel"
