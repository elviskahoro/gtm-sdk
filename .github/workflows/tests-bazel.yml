name: Bazel tests

on:
  pull_request:
    branches: [main]

concurrency:
  group: bazel-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bazel_impacted:
    name: Impacted Bazel targets (Dagger)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Prepare self-contained Git history
        run: |
          set -euo pipefail
          source_dir="${RUNNER_TEMP}/bazel-dagger-source"
          git clone --no-local --no-checkout --no-single-branch . "${source_dir}"
          git -C "${source_dir}" checkout --detach "$(git rev-parse HEAD)"
          git -C "${source_dir}" remote set-url origin \
            "https://github.com/${{ github.repository }}.git"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Cache Dagger controller and Bazel data
        id: bazel_cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.dagger-sdk/bazel-controller-venv
            ~/.dagger-sdk/bazel-uv-python
            ~/.bazel-dagger
          key: ${{ runner.os }}-${{ runner.arch }}-bazel-dagger-v1-restore
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bazel-dagger-v1-

      - name: Prepare cached Dagger and Bazel paths
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.dagger-sdk/bazel-controller-venv" \
            "$HOME/.dagger-sdk/bazel-uv-python" \
            "$HOME/.bazel-dagger/toolchain" \
            "$HOME/.bazel-dagger/cache"

      - name: Install Dagger Python SDK
        id: dagger_sdk
        run: |
          set -euo pipefail
          export UV_PYTHON_INSTALL_DIR="$HOME/.dagger-sdk/bazel-uv-python"
          dagger_venv="$HOME/.dagger-sdk/bazel-controller-venv"
          mkdir -p "${dagger_venv}" "${UV_PYTHON_INSTALL_DIR}"
          if ! "${dagger_venv}/bin/python" - <<'PY' 2>/dev/null
          from importlib.metadata import version
          import anyio
          import dagger
          assert version("dagger-io") == "0.21.7"
          assert version("anyio") == "4.13.0"
          PY
          then
            find "${dagger_venv}" -mindepth 1 -delete
            uv python install --reinstall 3.13
            uv venv --python 3.13 "${dagger_venv}"
            uv pip install --python "${dagger_venv}/bin/python" \
              "dagger-io==0.21.7" "anyio==4.13.0"
            echo "rebuilt=true" >> "$GITHUB_OUTPUT"
          else
            echo "rebuilt=false" >> "$GITHUB_OUTPUT"
          fi
          echo "${dagger_venv}/bin" >> "$GITHUB_PATH"

      - name: Cache verified ARM64 Bazel tools
        id: bazel_tools
        run: |
          set -euo pipefail
          toolchain_dir="$HOME/.bazel-dagger/toolchain"
          bazel_binary="${toolchain_dir}/bazel"
          bazel_diff_jar="${toolchain_dir}/bazel-diff_deploy.jar"
          bazel_sha="bfe9558bd8a2ecfe4841ec46c0dbccb4b469fe22d81f2f859de0de222b3e7ce3"
          bazel_diff_sha="4b649929970167f75a188d184cd07f00c83a82b363c70f74d3c1ad1f7cdefd51"
          if ! printf '%s  %s\n' "${bazel_sha}" "${bazel_binary}" | sha256sum --check --status 2>/dev/null; then
            curl --fail --location --silent --show-error \
              https://releases.bazel.build/8.7.0/release/bazel-8.7.0-linux-arm64 \
              --output "${bazel_binary}"
            printf '%s  %s\n' "${bazel_sha}" "${bazel_binary}" | sha256sum --check
            chmod +x "${bazel_binary}"
            refreshed=true
          fi
          if ! printf '%s  %s\n' "${bazel_diff_sha}" "${bazel_diff_jar}" | sha256sum --check --status 2>/dev/null; then
            curl --fail --location --silent --show-error \
              https://github.com/Tinder/bazel-diff/releases/download/v33.0.0/bazel-diff_deploy.jar \
              --output "${bazel_diff_jar}"
            printf '%s  %s\n' "${bazel_diff_sha}" "${bazel_diff_jar}" | sha256sum --check
            refreshed=true
          fi
          echo "refreshed=${refreshed:-false}" >> "$GITHUB_OUTPUT"

      - name: Save repaired Dagger controller and Bazel data
        if: steps.bazel_cache.outputs.cache-matched-key == '' || steps.dagger_sdk.outputs.rebuilt == 'true' || steps.bazel_tools.outputs.refreshed == 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.dagger-sdk/bazel-controller-venv
            ~/.dagger-sdk/bazel-uv-python
            ~/.bazel-dagger
          key: ${{ runner.os }}-${{ runner.arch }}-bazel-dagger-v1-${{ hashFiles('uv.lock', '.github/workflows/tests-bazel.yml', '.github/workflows/ci/bazel_dagger.py') }}-${{ github.run_id }}

      - name: Setup Dagger
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: 0.21.7

      - name: Run impacted Bazel targets in Dagger
        env:
          TRUNK_API_TOKEN: ${{ secrets.TRUNK_API_TOKEN }}
          TRUNK_REPOSITORY: ${{ github.repository }}
          TRUNK_PR_NUMBER: ${{ github.event.pull_request.number }}
          TRUNK_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TRUNK_PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CUSTOM: "true"
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          COMMIT_BRANCH: ${{ github.event.pull_request.head.ref }}
          JOB_NAME: Impacted Bazel targets (Dagger)
          JOB_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export BAZEL_DAGGER_BINARY="$HOME/.bazel-dagger/toolchain/bazel"
          export BAZEL_DAGGER_CACHE_DIR="$HOME/.bazel-dagger/cache"
          export BAZEL_DAGGER_DIFF_JAR="$HOME/.bazel-dagger/toolchain/bazel-diff_deploy.jar"
          export BAZEL_DAGGER_SOURCE_DIR="${RUNNER_TEMP}/bazel-dagger-source"
          DAGGER_NO_NAG=1 dagger run python .github/workflows/ci/bazel_dagger.py
