name: Bazel tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      run_impacted:
        required: false
        type: boolean
        default: false
      run_full:
        required: false
        type: boolean
        default: false
      diff_base_sha:
        required: false
        type: string
        default: ""
    secrets:
      TRUNK_API_TOKEN:
        required: false

concurrency:
  group: bazel-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  unit_tests:
    name: Unit tests
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare self-contained Git history
        run: |
          set -euo pipefail
          source_dir="${RUNNER_TEMP}/bazel-dagger-source"
          git clone --no-local --no-checkout --no-single-branch . "${source_dir}"
          git -C "${source_dir}" checkout --detach "$(git rev-parse HEAD)"
          git -C "${source_dir}" remote set-url origin \
            "https://github.com/${{ github.repository }}.git"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Cache Dagger controller and Bazel data
        id: bazel_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.dagger-sdk/bazel-controller-venv
            ~/.dagger-sdk/bazel-uv-python
            ~/.bazel-dagger
            ~/.bazel-dagger/uv-cache
          key: ${{ runner.os }}-${{ runner.arch }}-bazel-dagger-v1-restore
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bazel-dagger-v1-

      - name: Prepare cached Dagger and Bazel paths
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.dagger-sdk/bazel-controller-venv" \
            "$HOME/.dagger-sdk/bazel-uv-python" \
            "$HOME/.bazel-dagger/toolchain" \
            "$HOME/.bazel-dagger/cache" \
            "$HOME/.bazel-dagger/uv-cache"
          # Bazel runs as root inside Dagger and its exported cache can retain
          # root-owned directories across Actions cache restores.
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.bazel-dagger/cache"

      - name: Install Dagger Python SDK
        id: dagger_sdk
        run: |
          set -euo pipefail
          export UV_PYTHON_INSTALL_DIR="$HOME/.dagger-sdk/bazel-uv-python"
          dagger_venv="$HOME/.dagger-sdk/bazel-controller-venv"
          mkdir -p "${dagger_venv}" "${UV_PYTHON_INSTALL_DIR}"
          if ! "${dagger_venv}/bin/python" - <<'PY' 2>/dev/null
          from importlib.metadata import version
          import anyio
          import dagger
          assert version("dagger-io") == "0.21.7"
          assert version("anyio") == "4.13.0"
          PY
          then
            find "${dagger_venv}" -mindepth 1 -delete
            uv python install --reinstall 3.13
            uv venv --python 3.13 "${dagger_venv}"
            uv pip install --python "${dagger_venv}/bin/python" \
              "dagger-io==0.21.7" "anyio==4.13.0"
            echo "rebuilt=true" >> "$GITHUB_OUTPUT"
          else
            echo "rebuilt=false" >> "$GITHUB_OUTPUT"
          fi
          echo "${dagger_venv}/bin" >> "$GITHUB_PATH"

      - name: Cache verified ARM64 Bazel tools
        id: bazel_tools
        run: |
          set -euo pipefail
          toolchain_dir="$HOME/.bazel-dagger/toolchain"
          uv run scripts/bazel-dagger-toolchain.py --directory "${toolchain_dir}"

      - name: Setup Dagger
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: 0.21.7

      - name: Resolve Dagger engine version
        id: dagger_engine
        run: |
          set -uo pipefail
          version="$(dagger version 2>/dev/null | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)"
          if [ -z "${version}" ]; then
            echo "::warning::could not determine Dagger engine version; skipping pre-pull"
          fi
          echo "version=${version}" >>"${GITHUB_OUTPUT}"

      - name: Ensure Dagger engine image
        if: steps.dagger_engine.outputs.version != ''
        env:
          ENGINE_VERSION: ${{ steps.dagger_engine.outputs.version }}
        run: |
          set -uo pipefail
          image="registry.dagger.io/engine:${ENGINE_VERSION}"
          if docker image inspect "${image}" >/dev/null 2>&1; then
            echo "Dagger engine image cache: local hit (${image})"
            exit 0
          fi
          for attempt in $(seq 1 6); do
            if timeout 150 docker pull "${image}"; then
              echo "Dagger engine image pull succeeded on attempt ${attempt} (${image})"
              exit 0
            fi
            echo "::warning::engine pull attempt ${attempt}/6 failed; retrying in 20s"
            sleep 20
          done
          echo "::error::failed to pull ${image} after 6 attempts"
          exit 1

      - name: Run impacted Bazel unit tests in Dagger
        env:
          BAZEL_DAGGER_BINARY: ${{ github.workspace }}/.bazel-dagger/toolchain/bazel
          BAZEL_DAGGER_CACHE_DIR: ${{ github.workspace }}/.bazel-dagger/cache
          BAZEL_DAGGER_DIFF_JAR: ${{ github.workspace }}/.bazel-dagger/toolchain/bazel-diff_deploy.jar
          BAZEL_DAGGER_SOURCE_DIR: ${{ runner.temp }}/bazel-dagger-source
          BAZEL_CACHE_WRITE: ${{ github.event_name != 'pull_request' }}
          BAZEL_RUN_IMPACTED: ${{ inputs.run_impacted || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
          BAZEL_RUN_FULL: ${{ inputs.run_full || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
          BAZEL_DIFF_BASE_SHA: ${{ inputs.diff_base_sha || (github.event_name == 'push' && github.event.before) || '' }}
          TRUNK_API_TOKEN: ${{ secrets.TRUNK_API_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRUNK_REPOSITORY: ${{ github.repository }}
          TRUNK_PR_NUMBER: ${{ github.event.pull_request.number }}
          TRUNK_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TRUNK_PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CUSTOM: "true"
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_BRANCH: ${{ github.ref_name }}
          JOB_NAME: Unit tests
          JOB_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export BAZEL_DAGGER_BINARY="$HOME/.bazel-dagger/toolchain/bazel"
          export BAZEL_DAGGER_CACHE_DIR="$HOME/.bazel-dagger/cache"
          export BAZEL_DAGGER_DIFF_JAR="$HOME/.bazel-dagger/toolchain/bazel-diff_deploy.jar"
          export BAZEL_DAGGER_SOURCE_DIR="${RUNNER_TEMP}/bazel-dagger-source"
          DAGGER_NO_NAG=1 dagger run python .github/workflows/ci/bazel_dagger.py

      - name: Save Dagger controller and Bazel data
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.dagger-sdk/bazel-controller-venv
            ~/.dagger-sdk/bazel-uv-python
            ~/.bazel-dagger
            ~/.bazel-dagger/uv-cache
          key: ${{ runner.os }}-${{ runner.arch }}-bazel-dagger-v1-${{ hashFiles('uv.lock', '.github/workflows/tests-bazel.yml', '.github/workflows/ci/bazel_dagger.py') }}-${{ github.run_id }}
