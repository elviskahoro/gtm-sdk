name: Publish Flox CI images

on: # yamllint disable-line rule:empty-values
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - flox/toolchain/.flox/env/manifest.toml
      - flox/toolchain/.flox/env/manifest.lock
      - .github/workflows/ci/flox_image_dagger.py
      - .github/workflows/ci/pytest_dependency_image.py
      - .github/workflows/ci/pytest_dependency_image_publish.py
      - .github/workflows/flox-image-publish.yml
      - pyproject.toml
      - uv.lock

permissions:
  contents: read
  packages: write

concurrency:
  group: flox-toolchain-image-publish
  cancel-in-progress: false

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: ubuntu-24.04-arm
          - architecture: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: flox/install-flox-action@1128abd73431089ab9d871c893b4e72a729354e1 # v2.6.0
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: 0.21.7
      - name: Check latest publication eligibility
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${ARCHITECTURE}" == "arm64" ]] && [[ "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" == "${GITHUB_SHA}" ]]; then
            echo "FLOX_PUBLISH_LATEST=true" >> "$GITHUB_ENV"
          else
            echo "FLOX_PUBLISH_LATEST=false" >> "$GITHUB_ENV"
          fi
      - name: Publish toolchain image
        id: publish_toolchain
        env:
          FLOX_TOOLCHAIN_IMAGE: ghcr.io/${{ github.repository }}/flox-toolchain:${{ github.sha }}-${{ matrix.architecture }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run dagger run python .github/workflows/ci/flox_image_dagger.py
      - name: Publish pytest dependency image
        env:
          FLOX_TOOLCHAIN_IMAGE: ${{ steps.publish_toolchain.outputs.image_ref }}
          PYTEST_DEPENDENCY_IMAGE: ghcr.io/${{ github.repository }}/pytest-deps:${{ github.sha }}-${{ matrix.architecture }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run dagger run python .github/workflows/ci/pytest_dependency_image_publish.py
