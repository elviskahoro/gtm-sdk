name: ARM64 Dagger Bazel trial

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bazel_dagger:
    name: ARM64 Dagger Bazel trial
    runs-on: namespace-profile-test
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@445c25d7009680597d73eb03c4e1cd5be522ed73 # v9.0.0
        with:
          fetch-depth: 0

      - name: Verify Namespace runner shape
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            aarch64|arm64) ;;
            *) echo "::error::runner architecture must be ARM64"; exit 1 ;;
          esac
          test "$(getconf _NPROCESSORS_ONLN)" -eq 4

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          if [ "${FORCE_FULL}" = "true" ] || [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            classification_args=(--force-full)
          else
            classification_args=()
          fi
          if [ -n "${BASE_SHA}" ] && [ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              diff_range="${BASE_SHA}...${HEAD_SHA}"
            else
              diff_range="${BASE_SHA}..${HEAD_SHA}"
            fi
            git diff --name-status -z "${diff_range}" \
              | python3 scripts/bazel-change-classification.py "${classification_args[@]}" \
              | tee /tmp/bazel-classification.txt
          else
            python3 scripts/bazel-change-classification.py --force-full </dev/null \
              | tee /tmp/bazel-classification.txt
          fi
          if grep -q '^full:' /tmp/bazel-classification.txt; then
            echo "run_full=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run_full=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Report skipped full suite
        if: steps.classify.outputs.run_full == 'false'
        run: |
          echo "Dagger Bazel suite skipped: $(cat /tmp/bazel-classification.txt)"

      - name: Install uv
        if: steps.classify.outputs.run_full == 'true'
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false

      - name: Prepare Namespace cache paths
        if: steps.classify.outputs.run_full == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.dagger-sdk/bazel-controller-venv" \
            "$HOME/.dagger-sdk/bazel-uv-python" \
            "$HOME/.bazel-dagger/toolchain" \
            "$HOME/.bazel-dagger/cache"

      - name: Cache Dagger controller and Bazel data
        if: steps.classify.outputs.run_full == 'true'
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: uv
          path: |
            ~/.dagger-sdk/bazel-controller-venv
            ~/.dagger-sdk/bazel-uv-python
            ~/.bazel-dagger

      # On a cold cache, Namespace mounts the configured path after the setup
      # step above. Recreate the mount roots before either controller setup or
      # the Bazel download writes into them.
      - name: Initialize Namespace cache mounts
        if: steps.classify.outputs.run_full == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.dagger-sdk/bazel-controller-venv" \
            "$HOME/.dagger-sdk/bazel-uv-python" \
            "$HOME/.bazel-dagger/toolchain" \
            "$HOME/.bazel-dagger/cache"

      - name: Install Dagger Python SDK
        if: steps.classify.outputs.run_full == 'true'
        run: |
          set -euo pipefail
          export UV_PYTHON_INSTALL_DIR="$HOME/.dagger-sdk/bazel-uv-python"
          dagger_venv="$HOME/.dagger-sdk/bazel-controller-venv"
          mkdir -p "${dagger_venv}" "${UV_PYTHON_INSTALL_DIR}"
          if ! "${dagger_venv}/bin/python" - <<'PY' 2>/dev/null
          from importlib.metadata import version
          import anyio
          import dagger
          assert version("dagger-io") == "0.21.7"
          assert version("anyio") == "4.13.0"
          PY
          then
            find "${dagger_venv}" -mindepth 1 -delete
            uv python install --reinstall 3.13
            uv venv --python 3.13 "${dagger_venv}"
            uv pip install --python "${dagger_venv}/bin/python" \
              "dagger-io==0.21.7" "anyio==4.13.0"
          fi
          echo "${dagger_venv}/bin" >> "$GITHUB_PATH"

      - name: Cache verified ARM64 Bazel binary
        if: steps.classify.outputs.run_full == 'true'
        run: |
          set -euo pipefail
          bazel_binary="$HOME/.bazel-dagger/toolchain/bazel"
          expected_sha="bfe9558bd8a2ecfe4841ec46c0dbccb4b469fe22d81f2f859de0de222b3e7ce3"
          if ! printf '%s  %s\n' "${expected_sha}" "${bazel_binary}" | sha256sum --check --status 2>/dev/null; then
            curl --fail --location --silent --show-error \
              https://releases.bazel.build/8.7.0/release/bazel-8.7.0-linux-arm64 \
              --output "${bazel_binary}"
            printf '%s  %s\n' "${expected_sha}" "${bazel_binary}" | sha256sum --check
            chmod +x "${bazel_binary}"
          fi

      - name: Setup Dagger
        if: steps.classify.outputs.run_full == 'true'
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: 0.21.7

      - name: Run full Bazel suite in Dagger
        if: steps.classify.outputs.run_full == 'true'
        run: |
          # Resolve home at runtime so the cached path is not coupled to a runner's
          # checkout layout.
          export BAZEL_DAGGER_BINARY="$HOME/.bazel-dagger/toolchain/bazel"
          export BAZEL_DAGGER_CACHE_DIR="$HOME/.bazel-dagger/cache"
          DAGGER_NO_NAG=1 dagger run python .github/workflows/ci/bazel_dagger.py

      # #488 trial: this status stays non-required while it runs beside Unit
      # tests and Full Bazel suite. Promote only after three representative PR
      # runs plus one post-merge main run agree on coverage and result reporting.
      - name: Upload Bazel Test Results to Trunk.io
        if: ${{ !cancelled() && steps.classify.outputs.run_full == 'true' }}
        continue-on-error: true
        uses: trunk-io/analytics-uploader@385f1ccdf345b4532dc4b6c665dd432b702b8e28 # v2.1.2
        with:
          junit-paths: bazel-testlogs/**/test.xml
          org-slug: sanhedrin
          token: ${{ secrets.TRUNK_API_TOKEN }}
          cli-version: 0.14.0
          use-cache: true

  # This is a parallel trial for the existing GitHub-hosted Trunk impacted-target
  # check. Keep that check required until representative PR runs agree.
  bazel_impacted_dagger:
    name: ARM64 Dagger impacted Bazel trial
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: namespace-profile-test
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@445c25d7009680597d73eb03c4e1cd5be522ed73 # v9.0.0
        with:
          fetch-depth: 0

      - name: Verify Namespace runner shape
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            aarch64|arm64) ;;
            *) echo "::error::runner architecture must be ARM64"; exit 1 ;;
          esac
          test "$(getconf _NPROCESSORS_ONLN)" -eq 4

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false

      - name: Prepare Namespace cache paths
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.dagger-sdk/bazel-controller-venv" \
            "$HOME/.dagger-sdk/bazel-uv-python" \
            "$HOME/.bazel-dagger/toolchain" \
            "$HOME/.bazel-dagger/cache"

      - name: Cache Dagger controller and Bazel data
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: uv
          path: |
            ~/.dagger-sdk/bazel-controller-venv
            ~/.dagger-sdk/bazel-uv-python
            ~/.bazel-dagger

      - name: Initialize Namespace cache mounts
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.dagger-sdk/bazel-controller-venv" \
            "$HOME/.dagger-sdk/bazel-uv-python" \
            "$HOME/.bazel-dagger/toolchain" \
            "$HOME/.bazel-dagger/cache"

      - name: Install Dagger Python SDK
        run: |
          set -euo pipefail
          export UV_PYTHON_INSTALL_DIR="$HOME/.dagger-sdk/bazel-uv-python"
          dagger_venv="$HOME/.dagger-sdk/bazel-controller-venv"
          mkdir -p "${dagger_venv}" "${UV_PYTHON_INSTALL_DIR}"
          if ! "${dagger_venv}/bin/python" - <<'PY' 2>/dev/null
          from importlib.metadata import version
          import anyio
          import dagger
          assert version("dagger-io") == "0.21.7"
          assert version("anyio") == "4.13.0"
          PY
          then
            find "${dagger_venv}" -mindepth 1 -delete
            uv python install --reinstall 3.13
            uv venv --python 3.13 "${dagger_venv}"
            uv pip install --python "${dagger_venv}/bin/python" \
              "dagger-io==0.21.7" "anyio==4.13.0"
          fi
          echo "${dagger_venv}/bin" >> "$GITHUB_PATH"

      - name: Cache verified ARM64 Bazel tools
        run: |
          set -euo pipefail
          toolchain_dir="$HOME/.bazel-dagger/toolchain"
          bazel_binary="${toolchain_dir}/bazel"
          bazel_diff_jar="${toolchain_dir}/bazel-diff_deploy.jar"
          bazel_sha="bfe9558bd8a2ecfe4841ec46c0dbccb4b469fe22d81f2f859de0de222b3e7ce3"
          bazel_diff_sha="4b649929970167f75a188d184cd07f00c83a82b363c70f74d3c1ad1f7cdefd51"
          if ! printf '%s  %s\n' "${bazel_sha}" "${bazel_binary}" | sha256sum --check --status 2>/dev/null; then
            curl --fail --location --silent --show-error \
              https://releases.bazel.build/8.7.0/release/bazel-8.7.0-linux-arm64 \
              --output "${bazel_binary}"
            printf '%s  %s\n' "${bazel_sha}" "${bazel_binary}" | sha256sum --check
            chmod +x "${bazel_binary}"
          fi
          if ! printf '%s  %s\n' "${bazel_diff_sha}" "${bazel_diff_jar}" | sha256sum --check --status 2>/dev/null; then
            curl --fail --location --silent --show-error \
              https://github.com/Tinder/bazel-diff/releases/download/v33.0.0/bazel-diff_deploy.jar \
              --output "${bazel_diff_jar}"
            printf '%s  %s\n' "${bazel_diff_sha}" "${bazel_diff_jar}" | sha256sum --check
          fi

      - name: Setup Dagger
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: 0.21.7

      - name: Run impacted Bazel targets in Dagger
        env:
          BAZEL_DAGGER_MODE: impacted
          BAZEL_DAGGER_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BAZEL_DAGGER_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          export BAZEL_DAGGER_BINARY="$HOME/.bazel-dagger/toolchain/bazel"
          export BAZEL_DAGGER_CACHE_DIR="$HOME/.bazel-dagger/cache"
          export BAZEL_DAGGER_DIFF_JAR="$HOME/.bazel-dagger/toolchain/bazel-diff_deploy.jar"
          DAGGER_NO_NAG=1 dagger run python .github/workflows/ci/bazel_dagger.py
