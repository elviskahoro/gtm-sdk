name: Lint and type check with Trunk

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  trunk_check:
    name: Lint and type check with Trunk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python deps
        run: uv sync --frozen --all-extras --group dev

      - name: Expose venv to subsequent steps
        run: |
          echo "VIRTUAL_ENV=${{ github.workspace }}/.venv" >> "$GITHUB_ENV"
          echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"

      - name: Trunk Check
        uses: trunk-io/trunk-action@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1.3.1

      - name: Tach module boundaries
        uses: trunk-io/trunk-action@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1.3.1
        with:
          check-mode: all
          arguments: --filter=tach

      # External dependency ownership is enforced for runtime adapters. The
      # scripts and Dagger workflow trees are separate operational toolchains.
      - name: Tach external dependencies
        run: uv run tach check-external --exclude 'scripts/**,.github/workflows/ci/**'

      - name: Tach affected tests
        if: github.event_name == 'pull_request'
        run: uv run tach test --base origin/main -- -q

      - name: Tach affected tests after push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          TACH_BASE: ${{ github.event.before }}
        run: |
          if git cat-file -e "${TACH_BASE}^{commit}" 2>/dev/null; then
            uv run tach test --base "$TACH_BASE" -- -q
          else
            uv run pytest -q
          fi

      - name: Tach affected tests after initial push
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        run: uv run pytest -q

      # requirements_bazel.txt is gitignored and generated from uv.lock, so it
      # cannot drift -- but `uv export` can still start failing (a lock that no
      # longer matches pyproject.toml, a dependency uv refuses to resolve), and
      # every consumer of that generator sits behind the Bazel job, which is
      # `pull_request`-only, same-repo-guarded, and not a required status. That
      # leaves pushes to main and fork PRs with no signal at all until someone
      # opens a same-repo PR and the Bazel job dies on `test -s`.
      #
      # This runs the generator here instead, where the check IS required and
      # fires in both contexts. Do NOT swap this for `--check`: on a fresh
      # checkout the output file does not exist, so `--check` diffs against an
      # empty string and always exits 1. Last step in the job so the generated
      # file cannot influence the lint results above. (gs-dcbi)
      - name: Verify Bazel requirements generator
        run: |
          set -euo pipefail
          uv run scripts/bazel-requirements-sync.py
          test -s requirements_bazel.txt
