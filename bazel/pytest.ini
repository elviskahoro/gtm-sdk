[pytest]
# Keep Bazel's test runner independent from project packaging metadata. The
# launcher supplies the import mode and marker expression explicitly; this file
# owns only settings needed to make Bazel collection deterministic.
addopts = -p hypothesispytest
asyncio_mode = strict
norecursedirs =
    .*
    *.egg
    _darcs
    build
    CVS
    dist
    node_modules
    venv
    {arch}
    bazel-*
filterwarnings =
    ignore::DeprecationWarning:jsonpath.jsonpath
markers =
    integration: tests that hit live external APIs (require credentials; run with -m integration)
