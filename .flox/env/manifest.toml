schema-version = "1.13.0"


## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## -------------------------------------------------------------------
[install]
uv.pkg-path = "uv"
# Keep in lockstep with UV_PINNED_VERSION in scripts/conductor-workspace-setup.sh,
# which installs this same version on macOS workspaces that have no Flox.
uv.version = "0.11.26"
dolt.pkg-path = "dolt"
infisical.pkg-path = "infisical"
gh.pkg-path = "gh"
git.pkg-path = "git"
bd.flake = "github:gastownhall/beads/v1.1.0"
roborev.flake = "github:kenn-io/roborev/v0.62.1"
jq.pkg-path = "jq"
# gum.pkg-path = "gum"
# gum.version = "^0.14.5"


